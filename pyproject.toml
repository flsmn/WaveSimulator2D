[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-simulator-2d"
version = "0.1.0.dev4"
description = "Calibrated scalar 2D wave engine for Wave Studio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "torch>=2.5,<3"]

[project.optional-dependencies]
examples = ["opencv-python-headless>=4.10,<5", "matplotlib>=3.9,<4"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.setuptools.packages.find]
include = ["wave_sim2d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
